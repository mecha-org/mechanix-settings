name: mechanix-settings
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Yogita Hiray <yogitah@mechasystems.com>"
description: Mechanix Settings application
homepage: https://github.com/mecha-org/mechanix-settings.git
license: BSD

overrides:
  rpm:
    depends:
      - mechanix-flutter-engine = 3.47.0
  deb:
    depends:
      - "mechanix-flutter-engine (= 3.47.0)"

contents:
  - src: ./stage/bundle/mechanix_settings
    dst: /usr/share/mechanix/mechanix-settings/mechanix_settings
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib/libapp.so
    dst: /usr/share/mechanix/mechanix-settings/lib/libapp.so
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-settings/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_settings
    file_info:
      mode: 0755
  - src: ./org.mechanix.settings.desktop
    dst: /usr/share/applications/org.mechanix.settings.desktop
  - src: ./assets/desktop_icon.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.mechanix.settings.png

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
